# サイトの設定．書ける項目は Material for MkDocs の資料（英語）にある：
# https://squidfunk.github.io/mkdocs-material/

# サイトの名前．ページの上部とブラウザのタブに出る．テンプレートから作ったら書き換える
site_name: 研究ノート
# 公開するときは，次の行の先頭の「# 」を消し，公開先のアドレスを書く（README.md の「公開する」）
# site_url: https://アカウントの名前.github.io/リポジトリの名前/

theme:
  name: material
  language: ja # 検索欄などの表示を日本語にする
  features:
    - navigation.footer # ページの下に「前へ」「次へ」を出す
    - search.highlight # 検索した言葉をページの中で目立たせる
    - content.code.copy # コードの右上にコピーのボタンを出す
    - content.code.annotate # コードの行に (1) の注釈を付けられる
  palette: # 明るい表示と暗い表示を，右上のボタンで切り替える
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: ダークモードに切り替え
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: ライトモードに切り替え

plugins:
  - search:
      lang: ja

# 使える書き方を増やす．書き方の見本は docs/writing.md
markdown_extensions:
  - admonition # !!! note の囲み
  - attr_list # 見出しの {#id} など
  - md_in_html
  - tables
  - pymdownx.details # ??? で始まる，折りたためる囲み
  - pymdownx.arithmatex: # 数式（$...$ と $$...$$）
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid # 図を文字で書く（```mermaid）
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true # 見出しの横に，その見出しへのリンクを出す

# 数式を表示するための部品（docs/assets/javascripts/mathjax.js と MathJax）
extra_javascript:
  - assets/javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

# make（mkdocs build --strict）で止める誤りを増やす：
# nav に書き忘れたページと，ページの中の見出しへのリンク切れ
validation:
  nav:
    omitted_files: warn
  links:
    anchors: warn

# 左に並ぶページの一覧．「表示する名前: docs/ からの場所」の形で書く．
# ページを足したら，ここにも足す．「- ノート:」のような見出しの行は，下にページが1つもないと止まる
nav:
  - ホーム: index.md
  - 書き方の見本: writing.md
  - ノート:
      - はりのたわみ: notes/beam.md
